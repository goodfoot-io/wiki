name: Release CLI

on:
  push:
    tags:
      - "wiki-v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Fail fast on Linux BEFORE the Windows build. The committed bin/wiki.exe
  # must be a regular file: if it is a git symlink (mode 120000), the
  # windows-latest `actions/checkout` aborts with "unable to create symlink
  # ... Filename too long" (the stub text becomes the symlink target), an
  # opaque failure deep in the matrix. Checking the git index mode here
  # catches it regardless of how a runner materializes the path.
  verify-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed bin stub
        working-directory: packages/cli
        run: |
          STUB=bin/wiki.exe
          MODE=$(git ls-files -s "$STUB" | awk '{print $1}')
          echo "git index mode for $STUB: ${MODE:-<not tracked>}"
          if [ "$MODE" != "100644" ] && [ "$MODE" != "100755" ]; then
            echo "ERROR: packages/cli/$STUB must be a regular file in git (mode 100644)." >&2
            echo "       Found mode '${MODE:-<missing>}'. A symlink (120000) breaks the" >&2
            echo "       windows-latest checkout and is dropped by npm publish." >&2
            exit 1
          fi
          if [ ! -f "$STUB" ] || [ -L "$STUB" ]; then
            echo "ERROR: packages/cli/$STUB must be a regular file, not a symlink or missing." >&2
            exit 1
          fi
          # postinstall replaces this text stub with the native binary. The
          # `bin` field points here on every platform: the `.exe` suffix makes
          # npm/yarn/pnpm cmd-shim emit a direct exec on Windows; Unix ignores
          # the suffix and execs by mode bit. The first line must have NO `#!`
          # shebang or npm routes it through /bin/sh and breaks Windows.
          if [ "$(wc -c < "$STUB")" -gt 1024 ]; then
            echo "ERROR: packages/cli/$STUB is too large to be the stub (real binary committed?)." >&2
            exit 1
          fi
          if head -c 2 "$STUB" | grep -q '#!'; then
            echo "ERROR: packages/cli/$STUB has a shebang; npm would route it through /bin/sh and break Windows." >&2
            exit 1
          fi
          if ! grep -q 'replaces this file' "$STUB"; then
            echo "ERROR: packages/cli/$STUB does not look like the expected stub." >&2
            exit 1
          fi

  build:
    needs: verify-stub
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            npm-pkg: wiki-linux-x64
            binary: wiki
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            npm-pkg: wiki-linux-arm64
            binary: wiki
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            npm-pkg: wiki-darwin-x64
            binary: wiki
          - os: macos-latest
            target: aarch64-apple-darwin
            npm-pkg: wiki-darwin-arm64
            binary: wiki
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm-pkg: wiki-win32-x64
            binary: wiki.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          working-directory: packages/cli
          args: --release

      - name: Copy binary to npm package
        shell: bash
        run: |
          mkdir -p npm/${{ matrix.npm-pkg }}/bin
          cp packages/cli/target/${{ matrix.target }}/release/${{ matrix.binary }} npm/${{ matrix.npm-pkg }}/bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm-pkg }}
          path: npm/${{ matrix.npm-pkg }}/

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare platform packages
        run: |
          for pkg in wiki-linux-x64 wiki-linux-arm64 wiki-darwin-x64 wiki-darwin-arm64 wiki-win32-x64; do
            cp -r artifacts/$pkg/* npm/$pkg/
            chmod +x npm/$pkg/bin/wiki* 2>/dev/null || true
          done

      - name: Publish platform packages
        run: |
          for pkg in wiki-linux-x64 wiki-linux-arm64 wiki-darwin-x64 wiki-darwin-arm64 wiki-win32-x64; do
            echo "Publishing @goodfoot/$pkg..."
            cd npm/$pkg
            npm publish --access public --provenance
            cd ../..
          done

      # bin stub integrity is enforced by the `verify-stub` job, which gates
      # the entire pipeline (build → publish-npm) before any platform build.

      - name: Publish meta-package
        working-directory: packages/cli
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            for (const k of Object.keys(pkg.optionalDependencies || {}))
              pkg.optionalDependencies[k] = pkg.version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public --provenance

      # The opencode plugin ships its bundled dist/ checked in, so publish it
      # from a rebuild of the tagged sources and refuse if the committed bundle
      # is stale — same freshness contract as scripts/validate.sh.
      - name: Enable Yarn 4 via corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Rebuild OpenCode plugin bundle
        run: yarn workspace @goodfoot/agent-hooks build:opencode

      - name: Guard committed OpenCode plugin bundle freshness
        run: |
          if ! git diff --exit-code -- plugins-opencode/wiki/dist; then
            echo "ERROR: rebuild produced uncommitted bundle changes — commit the rebuilt plugins-opencode/wiki/dist" >&2
            exit 1
          fi

      # npm pack silently drops symlink entries, and plugins-opencode/wiki/skills
      # is a symlink into the central skills tree — publishing straight from the
      # source tree would ship a package whose installer cannot find skills/wiki
      # (the failure that shipped as 0.5.129). Pack through pack-opencode.mjs,
      # which stages a dereferenced copy, and fail closed unless the skill tree
      # verifiably made it into the tarball.
      - name: Publish OpenCode plugin package
        run: |
          TARBALL="$(node packages/agent-hooks/scripts/pack-opencode.mjs)"
          echo "Packed tarball: $TARBALL"
          if ! tar -tf "$TARBALL" | grep -q '^package/skills/wiki/SKILL.md$'; then
            echo "ERROR: packed @goodfoot/opencode-wiki is missing package/skills/wiki/SKILL.md — refusing to publish" >&2
            exit 1
          fi
          npm publish "$TARBALL" --access public --provenance

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for pkg in wiki-linux-x64 wiki-linux-arm64 wiki-darwin-x64 wiki-darwin-arm64 wiki-win32-x64; do
            if [ -f "artifacts/$pkg/bin/wiki.exe" ]; then
              cp "artifacts/$pkg/bin/wiki.exe" "release-assets/$pkg.exe"
            else
              cp "artifacts/$pkg/bin/wiki" "release-assets/$pkg"
            fi
          done

      - name: Generate checksums manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const releaseVersion = process.env.RELEASE_VERSION.replace(/^wiki-v/, '');
          const releaseDir = path.join(process.cwd(), 'release-assets');
          const assets = {
            'linux-x64': 'wiki-linux-x64',
            'linux-arm64': 'wiki-linux-arm64',
            'darwin-x64': 'wiki-darwin-x64',
            'darwin-arm64': 'wiki-darwin-arm64',
            'win32-x64': 'wiki-win32-x64.exe'
          };

          const manifest = { version: releaseVersion, assets: {} };
          for (const [key, fileName] of Object.entries(assets)) {
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(path.join(releaseDir, fileName))).digest('hex');
            manifest.assets[key] = { name: fileName, sha256 };
          }

          fs.writeFileSync(path.join(releaseDir, 'wiki-cli-checksums.json'), `${JSON.stringify(manifest, null, 2)}\n`);
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*

  release-extension:
    needs:
      - publish-npm
      - github-release
    uses: ./.github/workflows/release-extension.yml
    secrets: inherit
    with:
      release_tag: ${{ github.ref_name }}
