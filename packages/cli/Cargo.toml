[package]
name = "wiki"
version = "0.5.135"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = { version = "=0.84", default-features = false, features = ["revision", "sha1", "attributes", "index", "blob-diff", "excludes", "dirwalk"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled", "blob", "trace"] }
walkdir = "2"
sha2 = "0.10"
fs4 = { version = "0.13", features = ["sync"] }
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }


[build-dependencies]
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
serde_json = "1"
tempfile = "3"
