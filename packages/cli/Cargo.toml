[package]
name = "wiki"
version = "0.5.81"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = { version = "0.81", default-features = false, features = ["revision", "status", "sha1"] }
globset = "0.4"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
regex = "1"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
tempfile = "3"
turso = "0.5"
turso_core = { version = "0.5", features = ["fts"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
toml_edit = "0.22"
fs4 = { version = "0.13", features = ["sync"] }
indexmap = { version = "2", features = ["serde"] }

# `git-mesh` is installed by npm as `git-mesh.cmd`/`git-mesh.ps1` shims on
# Windows. `Command::new("git-mesh")` cannot find them (CreateProcessW ignores
# PATHEXT), so `git_mesh_command()` resolves the real path via PATHEXT-aware
# `which`. Only referenced under `#[cfg(windows)]`.
[target.'cfg(windows)'.dependencies]
which = "7"

[build-dependencies]
serde_json = "1"

# Windows "Installer Detection" heuristically forces any executable whose name
# contains `install`/`setup`/`update`/`patch` to require UAC elevation, so an
# auto-named `install_integration-<hash>.exe` test binary fails to launch with
# `os error 740`. Pin an explicit, token-free binary name while keeping the
# descriptive source filename.
[[test]]
name = "hook_provisioning_integration"
path = "tests/install_integration.rs"

[dev-dependencies]
