services:
  app:
    init: true
    cap_add:
      # Tailscale runs in TUN mode (real interface) so MagicDNS works system-wide.
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      # Workspace bound at /workspace (mirrors goodfoot-io/git-mesh layout).
      - ..:/workspace:cached
      # Host-backed home directory: persists Rust toolchain, .claude config,
      # zsh history, and Tailscale state across rebuilds without named volumes.
      - ${HOME}/devcontainer/wiki:/home/node:cached
      # opencode data (WAL-mode SQLite + logs) and card worktrees are the heavy
      # virtiofs writers; both move to container-native named volumes. Mounted at
      # top-level /var/lib/coaxial paths — NOT nested inside /home/node — because
      # libkrun attaches the home virtiofs bind after start, silently shadowing
      # nested mounts. The base entrypoint symlinks the home paths here.
      - opencode-data:/var/lib/coaxial/opencode
      - cards-worktrees:/var/lib/coaxial/cards-worktrees
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
      - CLAUDE_CONFIG_DIR=/home/node/.claude
    # No dns: pin — `tailscale up --accept-dns` manages /etc/resolv.conf
    # (MagicDNS at 100.100.100.100, with split-DNS to upstreams).
    command: sleep infinity

volumes:
  opencode-data:
  cards-worktrees:
